workflows:
  android-release:
    name: Android release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - android_signing
    scripts:
      - name: Restore Android signing key
        script: |
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CM_BUILD_DIR"], "petits_champions_release.jks").write_bytes(base64.b64decode(os.environ["PETITS_CHAMPIONS_KEYSTORE_BASE64"], validate=True))'
          printf 'PETITS_CHAMPIONS_STORE_FILE=%s\n' "$CM_BUILD_DIR/petits_champions_release.jks" >> "$CM_ENV"
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run Flutter tests
        script: flutter test --concurrency=1
      - name: Build signed Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
